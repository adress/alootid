<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy history</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="popup-title">Copy history</h1>
      <div class="history-toolbar">
        <a class="action-button quick-link" href="https://ratemyserver.net/" target="_blank" rel="noreferrer">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15 3h6v6M10 14 21 3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          RateMyServer
        </a>
        <button class="action-button action-clear js-clear-history" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M3 6h18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M8 6V4h8v2M6 6l1 14h10l1-14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M10 11v6M14 11v6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Clear history
        </button>
      </div>
      <p class="empty-state js-empty-state" hidden>No copied items yet.</p>
      <ul class="history-list js-history-list"></ul>
      <div class="history-pagination" hidden>
        <button class="pager-button js-prev-page" type="button">Previous</button>
        <span class="pager-info js-page-info"></span>
        <button class="pager-button js-next-page" type="button">Next</button>
      </div>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
